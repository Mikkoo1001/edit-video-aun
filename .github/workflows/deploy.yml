# วางไฟล์นี้ที่ .github/workflows/deploy.yml ในรีโปของโปรเจกต์
# ตั้งค่าครั้งเดียวที่ GitHub: Settings -> Secrets and variables -> Actions
#   Secrets:   CLOUDFLARE_API_TOKEN   (สิทธิ์ Cloudflare Pages: Edit)
#              CLOUDFLARE_ACCOUNT_ID
#   Variables: CF_PROJECT_NAME        (ชื่อโปรเจกต์ใน Cloudflare Pages)
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # กันอัปโหลดโค้ดที่พิมพ์ผิด (สคริปต์ฝั่งเบราว์เซอร์ + service worker)
      - name: Check JavaScript syntax
        run: |
          fail=0
          for f in sw.js $(find js -name '*.js'); do
            node --check "$f" || fail=1
          done
          python3 -c "import json; json.load(open('manifest.webmanifest', encoding='utf-8'))"
          exit $fail

      # เตรียมโฟลเดอร์ที่จะอัปโหลด (ตัดไฟล์ที่ไม่ต้องขึ้นเว็บออก)
      - name: Prepare dist
        run: |
          mkdir dist
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' --exclude '*.zip' --exclude 'README*' ./ dist/
          test -f dist/index.html && test -f dist/_worker.js && test -f dist/_headers

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PROJECT_NAME }} --branch=main --commit-dirty=true
          
