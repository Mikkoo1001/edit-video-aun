name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # หาโฟลเดอร์แอป (โฟลเดอร์ที่มี index.html + sw.js)
      # 1) ถ้าไฟล์อยู่ใน repo แล้ว ใช้เลย  2) ถ้า repo มีแต่ไฟล์ .zip จะแตกให้เอง
      - name: Find app folder
        id: app
        run: |
          set -euo pipefail
          find_app() {
            find "$1" -maxdepth 3 -name index.html \
              -not -path '*/.git/*' -not -path '*/node_modules/*' \
              | while read -r f; do d=$(dirname "$f"); [ -f "$d/sw.js" ] && echo "$d"; done | head -n1
          }
          DIR=$(find_app .)
          if [ -z "$DIR" ]; then
            ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | sort -V | tail -n1)
            if [ -n "$ZIP" ]; then
              echo "แตกไฟล์ $ZIP"
              mkdir -p _app
              unzip -q -o "$ZIP" -d _app
              DIR=$(find_app _app)
            fi
          fi
          if [ -z "$DIR" ]; then
            echo "::error::ไม่พบ index.html + sw.js (และไม่มีไฟล์ .zip ที่ใช้ได้) ใน repo"
            find . -maxdepth 2 -not -path './.git/*' | head -40
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "App folder: $DIR"

      - name: Check JavaScript syntax
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          set -euo pipefail
          fail=0
          # สคริปต์ปกติ: js/**, sw.js
          files=$(find js -type f -name '*.js' 2>/dev/null || true)
          [ -f sw.js ] && files="$files sw.js"
          for f in $files; do
            node --check "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done
          # _worker.js เป็น ES module (export default) → เช็คแบบ .mjs
          if [ -f _worker.js ]; then
            cp _worker.js "$RUNNER_TEMP/worker.mjs"
            node --check "$RUNNER_TEMP/worker.mjs" || { echo "::error file=_worker.js::syntax error"; fail=1; }
          fi
          # manifest ต้องเป็น JSON ที่ถูกต้อง
          if [ -f manifest.webmanifest ]; then
            node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))" \
              || { echo "::error file=manifest.webmanifest::invalid JSON"; fail=1; }
          fi
          exit $fail

      - name: Prepare dist
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          tar -C "${{ steps.app.outputs.dir }}" \
            --exclude='./.git' --exclude='./.github' --exclude='./node_modules' \
            --exclude='./dist' --exclude='*.zip' --exclude='*.md' \
            -cf - . | tar -C dist -xf -
          test -f dist/index.html
          rm -f dist/_worker.js dist/_headers   # ใช้บน Cloudflare เท่านั้น GitHub Pages ไม่รัน
          touch dist/.nojekyll
          echo "Files in dist: $(find dist -type f | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        
